<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plataformas de Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="plataforma.css">
</head>

<body>
    <h1>Plataformas de Streaming</h1>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>País</th>
                <th>Fecha de lanzamiento</th>
                <th>Tecnología</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>StarStream</td>
                <td>EE.UU.</td>
                <td>2022-05-10</td>
                <td>4K HDR</td>
                <td><button class="btn" onclick="openModal('StarStream')">Ver más</button></td>
            </tr>
            <tr>
                <td>AndinaPlay</td>
                <td>Colombia</td>
                <td>2021-11-03</td>
                <td>HD</td>
                <td><button class="btn" onclick="openModal('AndinaPlay')">Ver más</button></td>
            </tr>
        </tbody>
    </table>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content" style="padding-top: 42px; position: relative;">
            <span class="close" onclick="closeModal()" style="top: 20px;">×</span>

            <!-- Imagen destacada -->
            <div style="width: 100%; height: 200px; overflow: hidden; border-radius: 8px; margin-bottom: 24px;">
                <img src="https://peru21.pe/sites/default/efsfiles/2023-11/JUGNKDVFM5HEHJVJDETLUM5UFU.jpg"
                    alt="Imagen destacada" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>

            <!-- Información -->
            <h2 id="modal-title">Título</h2>
            <p><strong>País de origen:</strong> <span id="modal-pais"></span></p>
            <p><strong>Sitio web:</strong> <span id="modal-web"></span></p>
            <p><strong>Fecha de lanzamiento:</strong> <span id="modal-fecha"></span></p>
            <p><strong>Cobertura:</strong> <span id="modal-cobertura"></span></p>
            <p><strong>Tecnología de streaming:</strong> <span id="modal-tecnologia"></span></p>

            <!-- Botón Ver planes -->
            <div style="margin-top: 24px;">
                <a href="#" class="btn">Ver planes</a>
            </div>
        </div>
    </div>

    <script>
        const data = {
            "StarStream": {
                nombre: "StarStream",
                paisOrigen: "EE.UU.",
                sitioWeb: "https://starstream.com",
                fechaLanzamiento: "10 mayo 2022",
                cobertura: "Global",
                tecnologiaStreaming: "4K HDR"
            },
            "AndinaPlay": {
                nombre: "AndinaPlay",
                paisOrigen: "Colombia",
                sitioWeb: "https://andinaplay.co",
                fechaLanzamiento: "3 noviembre 2021",
                cobertura: "Latinoamérica",
                tecnologiaStreaming: "HD"
            }
        };

        function openModal(nombre) {
            const info = data[nombre];
            document.getElementById("modal-title").textContent = info.nombre;
            document.getElementById("modal-pais").textContent = info.paisOrigen;
            document.getElementById("modal-web").innerHTML = `<a href="${info.sitioWeb}" target="_blank">${info.sitioWeb}</a>`;
            document.getElementById("modal-fecha").textContent = info.fechaLanzamiento;
            document.getElementById("modal-cobertura").textContent = info.cobertura;
            document.getElementById("modal-tecnologia").textContent = info.tecnologiaStreaming;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }
    </script>

</body>

</html>
